[project]
name = "autonomous-data-analyst-backend"
version = "0.1.0"
description = "FastAPI backend for the Autonomous Data Analyst"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "anthropic>=1.0",
    "argon2-cffi>=23.1",
    "defusedxml>=0.7.1",
    "duckdb>=1.1",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "langgraph>=0.6",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.36",
    "sqlglot>=26",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF", "PT", "C4"]
ignore = [
    "S101",  # assert is fine in tests (and only used there)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "S311", "S608"]
# These modules build SQL from schema-validated, quoted identifiers, fixed literals and
# validated integers only; every user/model-supplied value is a bound parameter. See
# docs/SECURITY.md and tests/test_operations.py / tests/test_sql_guard.py.
"app/analytics/engine.py" = ["S608"]
"app/analytics/operations.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: requires a PostgreSQL database (TEST_DATABASE_URL)",
    "live_llm: calls a real LLM provider; requires credentials and is never run in standard CI",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
packages = ["app"]

[tool.coverage.run]
source = ["app"]
branch = true

[dependency-groups]
dev = [
    "httpx>=0.28",
    "httpx2>=2.14.0",
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.8",
]
