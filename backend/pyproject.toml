[project]
name = "autonomous-data-analyst-backend"
version = "0.1.0"
description = "FastAPI backend for the Autonomous Data Analyst"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF", "PT", "C4"]
ignore = [
    "S101",  # assert is fine in tests (and only used there)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: requires a PostgreSQL database (TEST_DATABASE_URL)",
    "live_llm: calls a real LLM provider; requires credentials and is never run in standard CI",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
packages = ["app"]

[tool.coverage.run]
source = ["app"]
branch = true

[dependency-groups]
dev = [
    "httpx>=0.28",
    "httpx2>=2.14.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.8",
]
