name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ada
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ada -d ada_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ada:ci-only-password@localhost:5432/ada_test
      # Database tests must run in CI; a missing database is a failure, not a skip.
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (lockfile must be current)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing:skip-covered
      - name: Analytical evaluation (tool mode, no LLM)
        run: uv run python -m evals.run --mode tools
      - name: OpenAPI schema is committed and current
        run: |
          uv run python -m app.openapi_export ../frontend/src/lib/api/openapi.json
          git diff --exit-code -- ../frontend/src/lib/api/openapi.json

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generated API types are current
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ada
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ada_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ada -d ada_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_DATABASE_URL: postgresql+psycopg://ada:ci-only-password@localhost:5432/ada_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: uv sync --locked
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests (real stack, scripted model)
        working-directory: frontend
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  dependency-audit:
    name: Dependency audit (runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Python runtime dependencies (pip-audit)
        working-directory: backend
        run: |
          uv export --locked --no-dev --no-hashes --format requirements-txt > runtime-requirements.txt
          uvx pip-audit --requirement runtime-requirements.txt --progress-spinner off
      - name: npm production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images and Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure environment
        run: printf 'POSTGRES_PASSWORD=ci-only-password\n' > .env
      - name: Build images
        run: docker compose build
      - name: Start the stack and wait for health checks
        run: docker compose up -d --wait --wait-timeout 240
      - name: Smoke test through the frontend
        run: |
          set -euo pipefail
          base=http://localhost:3000
          hdr=(-H 'X-Requested-With: fetch' -H "Origin: $base")
          curl -fsS "$base/login" > /dev/null
          curl -fsS "$base/api/health/ready" | tee /dev/stderr | grep -q '"status":"ready"'
          curl -fsS -c jar "${hdr[@]}" -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password"}' \
            "$base/api/auth/register" > /dev/null
          curl -fsS -b jar "${hdr[@]}" -F file=@data/samples/sales.csv "$base/api/datasets" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['row_count'] == 7620, d; print('upload ok')"
          curl -fsS -b jar "$base/api/config" | grep -q '"analysis_enabled":false'
          test "$(docker compose exec -T backend id -u)" = "10001"
          test "$(docker compose exec -T frontend id -u)" = "1000"
          echo "smoke test passed"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
